services:
  postgres:
    image: postgres:16-alpine
    container_name: reminder-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: go-schedule
      POSTGRES_PASSWORD: reminder123
      POSTGRES_DB: go_schedule
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
